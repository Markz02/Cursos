<html>
    <head>
        <title>ESTRUTURA HTML</title>
    </head>
    <body>
        <!-- atributos html -->
        <!-- Exemplo de atributo id -->
        <p id="paragrafo1">Este é um parágrafo com um atributo id.</p>

        <!-- Exemplo de atributo class -->
        <p class="paragrafo-classe">Este é um parágrafo com um atributo class.</p>

        <!-- Exemplo de atributo style -->
        <p style="color:blue;">Este é um parágrafo com um atributo style.</p>

        <!-- Exemplo de atributo title -->
        <p title="Este é um tooltip">Passe o mouse sobre este parágrafo para ver o tooltip.</p>

        <!-- Exemplo de atributo href em um link -->
        <a href="https://www.example.com">Este é um link com um atributo href.</a>

        <!-- Exemplo de atributo src em uma imagem -->
        <img src="imagem.jpg" alt="Descrição da imagem">

        <!-- Exemplo de atributo alt em uma imagem -->
        <img src="imagem.jpg" alt="Descrição da imagem">

        <!-- Exemplo de atributo target em um link -->
        <a href="https://www.example.com" target="_blank">Este link abre em uma nova aba.</a>
    </body>
</html>
